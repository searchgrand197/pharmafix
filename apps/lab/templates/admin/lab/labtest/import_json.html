{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <h1>{{ title }}</h1>
  <p>
    Upload a lab template JSON pack and apply it to any hospital.
    Matching uses <strong>test code</strong> first, then <strong>test name</strong>.
  </p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset class="module aligned">
      <div class="form-row">
        <label for="id_hospital">Target hospital:</label>
        <select name="hospital_id" id="id_hospital" required>
          <option value="">---------</option>
          {% for h in hospitals %}
            <option value="{{ h.id }}">{{ h.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row">
        <label for="id_pack">JSON pack file:</label>
        <input type="file" name="pack_file" id="id_pack" accept=".json,application/json" required>
      </div>
      <div class="form-row">
        <label>
          <input type="checkbox" name="overwrite" checked>
          Overwrite existing templates with the same code/name
        </label>
      </div>
      <div class="form-row">
        <label>
          <input type="checkbox" name="replace_parameters" checked>
          Replace parameter rows to match the pack
        </label>
      </div>
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="Import pack" class="default">
      <a href="{% url 'admin:lab_labtest_changelist' %}" class="button cancel-link">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
