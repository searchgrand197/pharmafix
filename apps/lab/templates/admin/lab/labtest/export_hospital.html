{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
  <h1>{{ title }}</h1>
  <p>Download all lab test templates (with parameters) for one hospital as a shareable JSON pack.</p>
  <form method="post">
    {% csrf_token %}
    <fieldset class="module aligned">
      <div class="form-row">
        <label for="id_hospital">Hospital:</label>
        <select name="hospital_id" id="id_hospital" required>
          <option value="">---------</option>
          {% for h in hospitals %}
            <option value="{{ h.id }}">{{ h.name }}</option>
          {% endfor %}
        </select>
      </div>
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="Download JSON" class="default">
      <a href="{% url 'admin:lab_labtest_changelist' %}" class="button cancel-link">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
