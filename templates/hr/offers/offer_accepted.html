<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Accepted | Curevice</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #6366f1;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --bg: #f3f4f6;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #eef2ff 0%, #f9fafb 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 48px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.8);
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #ecfdf5;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 24px;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        h1 {
            font-weight: 700;
            font-size: 28px;
            margin: 0 0 12px;
            color: var(--text-dark);
        }
        p.subtitle {
            font-size: 16px;
            color: var(--text-light);
            line-height: 1.6;
            margin: 0 0 40px;
        }
        p.subtitle strong {
            color: var(--text-dark);
            font-weight: 600;
        }
        .next-steps {
            font-size: 15px;
            color: var(--text-dark);
            line-height: 1.6;
            background: #eff6ff;
            padding: 20px 24px;
            border-radius: 12px;
            border-left: 4px solid var(--secondary);
            margin-bottom: 28px;
            text-align: left;
        }
        .footer {
            font-size: 13px;
            color: var(--text-light);
        }
        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="success-icon">✓</div>
        <h1>Offer Accepted!</h1>
        <p class="subtitle">Congratulations, <strong>{{ offer.candidate_name }}</strong>! We are thrilled to have you join our team at <strong>{{ offer.company_name }}</strong>.</p>

        <div class="next-steps">
            Our HR team will reach out to you within 24 hours with your onboarding roadmap and documentation requirements.
        </div>

        <div class="footer">
            {{ offer.company_name }} Recruitment Team
        </div>
    </div>
</body>
</html>
