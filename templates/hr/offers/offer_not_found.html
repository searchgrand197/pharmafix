<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Not Found</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }
        .icon {
            font-size: 80px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        h1 {
            color: #6c757d;
            margin-bottom: 10px;
        }
        .message {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .footer {
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">?</div>
        <h1>Offer Not Found</h1>
        
        <p class="message">
            The offer you are looking for does not exist or has been deleted.<br>
            Please check the link in your email or contact our HR team for assistance.
        </p>
        
        <div class="footer">
            If you believe this is an error, please contact HR support.
        </div>
    </div>
</body>
</html>
